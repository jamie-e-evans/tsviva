name: C CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Build and run tests (${{ matrix.cc }})
        env:
          CC: ${{ matrix.cc }}
        run: |
          make test
          make clean

      - name: Run AddressSanitizer & UBSan (${{ matrix.cc }})
        env:
          CC: ${{ matrix.cc }}
        run: make asan

